[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-reinforcement-learning-quantitative-trading"
version = "0.1.0"
description = "Exploratory DRL research framework for Hong Kong IPO aftermarket trading"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
parquet = ["pyarrow"]
excel = ["openpyxl", "xlrd>=2.0.1"]
marketdata = ["yfinance"]
pdf = ["pypdf"]
drl = ["torch>=2.2"]
finrl-baseline = ["gymnasium>=0.29,<2", "stable-baselines3>=2.4.1,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
